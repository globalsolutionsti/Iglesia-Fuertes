<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Iglesia Fuertes V2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=20260903-grupos-fecha">
</head>
<body>
  <div class="background-orb background-orb-one"></div>
  <div class="background-orb background-orb-two"></div>

  <div id="app-root"></div>

  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <div id="loading-overlay" class="loading-overlay hidden">
    <div class="loading-card">
      <div class="loading-spinner"></div>
      <p id="loading-message">Cargando sistema...</p>
    </div>
  </div>

  <script>
    (function () {
      function showStartupFallback(message) {
        var root = document.getElementById("app-root");
        if (!root || root.innerHTML.trim()) {
          return;
        }

        root.innerHTML = [
          '<section style="min-height:100vh;display:grid;place-items:center;background:#f5f5f5;padding:24px;font-family:Arial,sans-serif;color:#111;">',
          '<article style="width:min(560px,100%);background:#fff;border:1px solid #ddd;border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.12);">',
          '<strong style="display:inline-block;background:#fee2e2;color:#991b1b;border-radius:999px;padding:8px 12px;font-size:12px;text-transform:uppercase;">Modo rescate</strong>',
          '<h1 style="margin:18px 0 10px;font-size:28px;">No se pudo iniciar la pantalla</h1>',
          '<p style="line-height:1.5;color:#555;">El navegador no logró cargar correctamente el portal. Presiona el botón para limpiar la sesión local y forzar una recarga limpia.</p>',
          '<pre style="white-space:pre-wrap;background:#f8fafc;border:1px solid #e5e7eb;border-radius:14px;padding:12px;color:#334155;max-height:180px;overflow:auto;">' + String(message || "Error no disponible").replace(/[&<>"']/g, function (char) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" })[char]; }) + '</pre>',
          '<button id="startup-reset-button" style="appearance:none;border:0;border-radius:16px;background:#111;color:#fff;font-weight:800;padding:14px 18px;cursor:pointer;">Limpiar sesión y recargar</button>',
          '</article>',
          '</section>'
        ].join("");

        var button = document.getElementById("startup-reset-button");
        if (button) {
          button.addEventListener("click", function () {
            try {
              localStorage.clear();
              sessionStorage.clear();
            } catch (error) {}
            window.location.href = window.location.pathname + "?v=rescate-" + Date.now();
          });
        }
      }

      window.addEventListener("error", function (event) {
        showStartupFallback(event.message || (event.error && event.error.message));
      });

      window.addEventListener("unhandledrejection", function (event) {
        var reason = event.reason || {};
        showStartupFallback(reason.message || String(reason));
      });

      window.setTimeout(function () {
        showStartupFallback("El sistema no pintó contenido después de 6 segundos. Puede ser caché, sesión local dañada o archivo incompleto en GitHub Pages.");
      }, 6000);
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  <script type="module" src="js/app.js?v=20260904-asistencia-especial-qr-fix"></script>
</body>
</html>
